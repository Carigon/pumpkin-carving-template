name: Check

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR makes the older run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Typecheck (whole app, plus the core without the DOM), lint, unused exports, then the tests.
      - run: npm run check
